<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#9be969" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="动物园消消乐" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>动物园消消乐</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="phone-game" aria-live="polite">
      <section class="start-screen" id="startScreen">
        <div class="start-scene" id="startScene" aria-hidden="true"></div>
        <div class="start-card">
          <div class="start-title-lockup" aria-label="动物园消消乐">
            <span class="title-spark" aria-hidden="true"></span>
            <h1>动物园消消乐</h1>
          </div>
          <div class="start-actions">
            <button class="start-button continue-button hidden" id="continueBtn" type="button">继续游戏</button>
            <button class="start-button" id="startBtn" type="button">开始游戏</button>
          </div>
        </div>
      </section>

      <section class="hud">
        <div class="brand">
          <div class="game-wordmark">
            <h2>动物园消消乐</h2>
            <p id="goalText">第 1 关</p>
          </div>
        </div>
        <div class="hud-actions">
          <div class="resource-row" aria-label="资源">
            <div class="coin-pill" aria-label="金币">
              <span class="mini-icon coin-icon" aria-hidden="true"></span>
              <strong id="coinText">0</strong>
            </div>
            <div class="revive-pill" aria-label="复活道具">
              <span class="mini-icon revive-icon" aria-hidden="true"></span>
              <strong id="reviveText">0</strong>
            </div>
          </div>
          <button class="settings-button" id="settingsBtn" type="button" aria-label="设置" title="设置">
            <span aria-hidden="true"></span>
          </button>
        </div>
      </section>

      <div class="settings-panel hidden" id="settingsPanel" aria-label="设置菜单">
        <button id="manualSaveBtn" type="button">手动存档</button>
        <button id="exitGameBtn" type="button">退出游戏</button>
      </div>

      <section class="level-strip">
        <div class="stat">
          <span>关卡</span>
          <strong id="levelText">1</strong>
        </div>
        <div class="stat">
          <span>剩余</span>
          <strong id="leftText">0</strong>
        </div>
        <div class="stat">
          <span>连击</span>
          <strong id="comboText">0</strong>
        </div>
      </section>

      <section class="board-wrap" aria-label="动物园棋盘">
        <div class="zoo-scenery" aria-hidden="true">
          <span class="tree tree-a"></span>
          <span class="tree tree-b"></span>
          <span class="fence"></span>
          <span class="pond"></span>
          <span class="path"></span>
          <span class="bush bush-a"></span>
          <span class="bush bush-b"></span>
          <span class="cloud cloud-a"></span>
          <span class="cloud cloud-b"></span>
        </div>
        <div class="board" id="board"></div>
        <div class="message" id="message" role="status"></div>
      </section>

      <section class="tools" aria-label="道具">
        <button class="tool-button tool-hint" id="hintBtn" type="button" aria-label="提示" title="提示">
          <span class="tool-icon item-icon item-icon-hint" aria-hidden="true"></span>
          <span class="tool-count" id="hintCount">0</span>
        </button>
        <button class="tool-button tool-undo" id="undoBtn" type="button" aria-label="撤回" title="撤回">
          <span class="tool-icon item-icon item-icon-undo" aria-hidden="true"></span>
          <span class="tool-count" id="undoCount">0</span>
        </button>
        <button class="tool-button tool-shuffle" id="shuffleBtn" type="button" aria-label="洗牌" title="洗牌">
          <span class="tool-icon item-icon item-icon-shuffle" aria-hidden="true"></span>
          <span class="tool-count" id="shuffleCount">0</span>
        </button>
      </section>

      <section class="tray-section" aria-label="收集槽">
        <div class="tray-label">
          <span>小动物篮</span>
          <strong id="trayCount">0 / 5</strong>
        </div>
        <div class="tray" id="tray"></div>
      </section>
    </main>

    <div class="dialog-backdrop hidden" id="dialogBackdrop">
      <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
        <img class="meme" id="dialogMeme" alt="" src="./assets/meme-success.png" />
        <h2 id="dialogTitle">过关啦</h2>
        <p id="dialogText">小动物都回到家啦。</p>
        <div class="reward-row" id="rewardRow"></div>
        <div class="shop hidden" id="shopPanel" aria-label="过关商店">
          <div class="shop-head">
            <span>过关商店</span>
            <strong id="shopCoinText">0 金币</strong>
          </div>
          <div class="shop-list" id="shopList"></div>
        </div>
        <div class="dialog-actions">
          <button class="primary" id="nextBtn" type="button">下一关</button>
          <button class="secondary" id="againBtn" type="button">结束游戏</button>
        </div>
      </section>
    </div>

    <script src="./game.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./service-worker.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
